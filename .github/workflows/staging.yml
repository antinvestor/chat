# Staging Deployment - Triggered on pushes to main
# Deploys debug builds for testing purposes
name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.7'
  JAVA_VERSION: '17'

jobs:
  # Run tests first
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          flags: staging
        continue-on-error: true

  # Build all platforms using reusable workflow
  build:
    name: Build
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      environment: staging
      build_type: debug
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # Deploy Web to Cloudflare Pages (Staging)
  deploy-web-staging:
    name: Deploy Web to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build-staging
          path: build/web

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME_STAGING || 'stawi-staging' }} --branch=staging
        continue-on-error: true

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Web URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed from commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Deploy Android to Play Store Internal Testing
  deploy-android-staging:
    name: Deploy Android to Play Store (Internal)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-staging
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'com.antinvestor.chat' }}
          releaseFiles: artifacts/*.apk
          track: internal
          status: completed
          releaseName: "Staging Build - ${{ github.sha }}"
          whatsNewDirectory: fastlane/metadata/android
        continue-on-error: true

      - name: Upload to Firebase App Distribution (fallback)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: artifacts/app-debug.apk
          releaseNotes: |
            Staging Build
            Commit: ${{ github.sha }}
            Branch: main
            Build: ${{ github.run_number }}
        continue-on-error: true

  # Deploy iOS to TestFlight (Staging)
  deploy-ios-staging:
    name: Deploy iOS to TestFlight (Staging)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-staging
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      # Note: For staging, we typically use Firebase App Distribution
      # TestFlight requires signed builds which need Apple Developer certificates
      - name: Upload to Firebase App Distribution (iOS)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: artifacts/Runner.ipa
          releaseNotes: |
            Staging Build
            Commit: ${{ github.sha }}
            Branch: main
            Build: ${{ github.run_number }}
        continue-on-error: true

  # Notify on deployment
  notify:
    name: Notify Deployment
    needs: [deploy-web-staging, deploy-android-staging, deploy-ios-staging]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "## 📦 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Cloudflare) | ${{ needs.deploy-web-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android (Play Store Internal) | ${{ needs.deploy-android-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS (Firebase) | ${{ needs.deploy-ios-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
