# Staging Deployment - Triggered on pushes to main
# Tests already passed in CI (PR phase), so just build and deploy
name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # Build all platforms using reusable workflow
  # Skip tests since they passed in CI before merge
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      environment: staging
      build_type: debug
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  # Deploy Web to Cloudflare Pages (Staging)
  deploy-web:
    name: Deploy Web
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Download web build
        id: download
        uses: actions/download-artifact@v7
        with:
          name: web-build-staging
          path: build/web
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Web build artifact not found. Web build may have failed."
          exit 1

      - name: List downloaded files
        run: |
          echo "Contents of build/web:"
          ls -la build/web/ || echo "Directory not found"
          echo "Total files:"
          find build/web -type f | wc -l || echo "0"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME_STAGING || 'stawi-staging' }} --branch=staging

  # Deploy Android to Firebase App Distribution
  deploy-android:
    name: Deploy Android
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 15
    environment:
      name: staging

    steps:
      - name: Download APK
        id: download
        uses: actions/download-artifact@v7
        with:
          name: android-apk-staging
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Android APK artifact not found. Android build may have failed."
          exit 0

      - name: Upload to Firebase App Distribution
        if: steps.download.outcome == 'success'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: artifacts/app-debug.apk
          releaseNotes: |
            Staging Build
            Commit: ${{ github.sha }}
            Branch: main
            Build: ${{ github.run_number }}
        continue-on-error: true

  # Deploy iOS to Firebase App Distribution
  deploy-ios:
    name: Deploy iOS
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 15
    environment:
      name: staging

    steps:
      - name: Download IPA
        id: download
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa-staging
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::iOS IPA artifact not found. iOS build may have failed."
          exit 0

      - name: Upload to Firebase App Distribution
        if: steps.download.outcome == 'success'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: artifacts/Runner.ipa
          releaseNotes: |
            Staging Build
            Commit: ${{ github.sha }}
            Branch: main
            Build: ${{ github.run_number }}
        continue-on-error: true

  # Summary
  notify:
    name: Summary
    needs: [deploy-web, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.deploy-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.deploy-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
