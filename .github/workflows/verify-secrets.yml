name: Verify secrets
on: workflow_dispatch
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Hash key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          printf "%s" "$ANDROID_SIGNING_KEY" | sha256sum | cut -d" " -f1
          echo "len=${#ANDROID_SIGNING_KEY}"