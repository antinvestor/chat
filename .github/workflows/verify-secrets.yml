name: Fix signing key v3
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Copy signing key via API
        env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          pip install pynacl > /dev/null 2>&1
          python3 << 'PYEOF'
          import os, base64, json, subprocess
          from nacl import encoding, public

          token = os.environ["GH_TOKEN"]
          secret_value = os.environ["ANDROID_SIGNING_KEY"]
          repo = "antinvestor/service-chat"

          # Get public key
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/secrets/public-key"],
              capture_output=True, text=True
          )
          key_data = json.loads(result.stdout)
          public_key = public.PublicKey(key_data["key"].encode("utf-8"), encoding.Base64Encoder())

          # Encrypt
          sealed_box = public.SealedBox(public_key)
          encrypted = sealed_box.encrypt(secret_value.encode("utf-8"))
          encrypted_b64 = base64.b64encode(encrypted).decode("utf-8")

          # Set secret
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/secrets/ANDROID_SIGNING_KEY",
               "-X", "PUT",
               "-f", f"encrypted_value={encrypted_b64}",
               "-f", f"key_id={key_data['key_id']}"],
              capture_output=True, text=True
          )
          print(f"Status: {result.returncode}")
          if result.stderr:
              print(f"Error: {result.stderr}")
          print("Done")
          PYEOF