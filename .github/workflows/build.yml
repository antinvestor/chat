# Reusable build workflow for all platforms
name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: 'Build environment (staging or production)'
        required: true
        type: string
      build_type:
        description: 'Build type (debug or release)'
        required: true
        type: string
      version:
        description: 'Version string for the build'
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_SIGNING_KEY:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      BUILD_PROVISION_PROFILE_BASE64:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

env:
  FLUTTER_VERSION: '3.38.7'
  JAVA_VERSION: '17'

jobs:
  # Android Build
  build-android:
    name: Build Android (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      aab_path: ${{ steps.build.outputs.aab_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Android signing
        if: inputs.build_type == 'release'
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > android/app/keystore.jks
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=key
          storeFile=keystore.jks
          EOF
          fi

      - name: Build Android
        id: build
        run: |
          BUILD_ARGS=""
          if [ "${{ inputs.build_type }}" == "release" ]; then
            BUILD_ARGS="--release --shrink"
          else
            BUILD_ARGS="--debug"
          fi

          # Set version if provided
          if [ -n "${{ inputs.version }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=${{ inputs.version }}"
          fi

          # Build APK
          flutter build apk $BUILD_ARGS

          # Build AAB for release only
          if [ "${{ inputs.build_type }}" == "release" ]; then
            flutter build appbundle $BUILD_ARGS
            echo "aab_path=build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT
          fi

          if [ "${{ inputs.build_type }}" == "release" ]; then
            echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.environment }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 14

      - name: Upload AAB artifact
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.environment }}
          path: ${{ steps.build.outputs.aab_path }}
          retention-days: 14

  # iOS Build
  build-ios:
    name: Build iOS (${{ inputs.build_type }})
    runs-on: macos-latest
    timeout-minutes: 60

    outputs:
      ipa_path: ${{ steps.build.outputs.ipa_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup iOS project
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

          cd ios
          # Set deployment target
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" Runner.xcodeproj/project.pbxproj || true

          # Update Podfile
          if grep -q "^# platform :ios" Podfile 2>/dev/null; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" Podfile
          elif grep -q "^platform :ios" Podfile 2>/dev/null; then
            sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" Podfile
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Setup iOS signing (Production)
        if: inputs.build_type == 'release' && inputs.environment == 'production'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          fi

      - name: Build iOS
        id: build
        run: |
          BUILD_ARGS=""
          if [ "${{ inputs.build_type }}" == "release" ]; then
            if [ "${{ inputs.environment }}" == "production" ]; then
              BUILD_ARGS="--release"
            else
              BUILD_ARGS="--release --no-codesign"
            fi
          else
            BUILD_ARGS="--debug --no-codesign"
          fi

          if [ -n "${{ inputs.version }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=${{ inputs.version }}"
          fi

          flutter build ios $BUILD_ARGS

          # Create IPA
          mkdir -p build/ios/ipa
          if [ "${{ inputs.build_type }}" == "release" ] && [ "${{ inputs.environment }}" == "production" ]; then
            # Signed build - use xcodebuild archive
            cd ios
            xcodebuild -workspace Runner.xcworkspace \
              -scheme Runner \
              -sdk iphoneos \
              -configuration Release \
              -archivePath $RUNNER_TEMP/Runner.xcarchive \
              archive || true

            if [ -d "$RUNNER_TEMP/Runner.xcarchive" ]; then
              xcodebuild -exportArchive \
                -archivePath $RUNNER_TEMP/Runner.xcarchive \
                -exportOptionsPlist ../ExportOptions.plist \
                -exportPath ../build/ios/ipa || true
            fi
          fi

          # Fallback: create unsigned IPA from .app
          if [ ! -f "build/ios/ipa/*.ipa" ]; then
            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              cd build/ios/ipa
              mkdir -p Payload
              cp -r ../iphoneos/Runner.app Payload/
              zip -r Runner.ipa Payload
              rm -rf Payload
            fi
          fi

          echo "ipa_path=build/ios/ipa/Runner.ipa" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: build/ios/ipa/
          retention-days: 14

  # Web Build
  build-web:
    name: Build Web (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      web_path: ${{ steps.build.outputs.web_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        id: build
        run: |
          BUILD_ARGS=""
          if [ "${{ inputs.build_type }}" == "release" ]; then
            BUILD_ARGS="--release"
          else
            BUILD_ARGS="--profile"  # Debug builds for web use profile mode
          fi

          flutter build web $BUILD_ARGS --base-href /

          echo "web_path=build/web" >> $GITHUB_OUTPUT

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ inputs.environment }}
          path: build/web/
          retention-days: 14
