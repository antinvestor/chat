name: Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  # Code Coverage Check
  coverage_check:
    name: Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        
    - name: Run tests with coverage
      run: flutter test --coverage
      
    - name: Check coverage threshold
      run: |
        COVERAGE=$(lcov --summary coverage/lcov.info | grep "lines......:" | awk '{print $2}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below required 80%"
          exit 1
        fi
        
    - name: Generate coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  # Performance Benchmarks
  performance_benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # Non-blocking until fully implemented
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        
    - name: Run performance benchmarks
      run: |
        flutter test test/performance_test/ --reporter=expanded
        
    - name: Check performance thresholds
      run: |
        # Check if performance metrics meet requirements
        python scripts/check_performance.py
        
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: test_results/

  # Memory Leak Detection
  memory_leak_test:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true  # Non-blocking until fully implemented
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        
    - name: Run memory leak tests
      run: |
        flutter test test/memory_test/ --timeout=600s
        
    - name: Analyze memory usage
      run: |
        python scripts/analyze_memory.py

  # Accessibility Tests
  accessibility_test:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        
    - name: Run accessibility tests
      run: |
        flutter test test/accessibility_test/
        
    - name: Generate accessibility report
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report
        path: accessibility_report/

  # Security Vulnerability Scan
  security_scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Run dependency audit
      run: |
        echo "🔒 Running Flutter security audit..."
        ./scripts/security_audit.sh
        
    - name: Upload security audit reports
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-reports
        path: security_reports/

  # Bundle Size Analysis
  bundle_size_analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        
    - name: Build release APK
      run: flutter build apk --release --shrink
      
    - name: Analyze bundle size
      run: |
        APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
        echo "APK size: ${APK_SIZE} bytes"
        
        # Check if APK size is within limits (50MB)
        if [ $APK_SIZE -gt 52428800 ]; then
          echo "APK size ${APK_SIZE} bytes exceeds 50MB limit"
          exit 1
        fi
        
    - name: Generate bundle size report
      uses: actions/upload-artifact@v4
      with:
        name: bundle-size-report
        path: build/

  # Documentation Generation
  documentation_check:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Non-blocking until fully implemented
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate documentation
      run: |
        dart doc
        
    - name: Check documentation coverage
      run: |
        python scripts/check_documentation.py
        
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: doc/api/
